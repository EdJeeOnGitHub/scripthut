<style>
  .artifact-shell{max-width:1180px;margin:auto;padding:28px 24px 64px}
  .artifact-kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#64748b}
  .artifact-panel{background:white;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 2px 5px #0f172a03}

  .artifact-link{color:#1d4ed8;font-weight:500}.artifact-link:hover{text-decoration:underline}
