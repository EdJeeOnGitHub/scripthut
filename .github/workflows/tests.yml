name: Tests

on:
  push:
    branches: [ main, develop, production ]
  pull_request:
    branches: [ main, develop, production ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Production is a Linux container with POSIX sockets, locks and SSH.
        # Keep upstream development's existing platform matrix unchanged.
        os: ${{ fromJSON((github.ref == 'refs/heads/production' || github.base_ref == 'production') && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Verify OpenSSH integration prerequisite
      if: runner.os != 'Windows'
      run: ssh -V

    - name: Run tests
      run: |
        pytest --tb=short -v

    - name: Test installation
      run: |
        scripthut --help
